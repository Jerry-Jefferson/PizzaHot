name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npx eslint src test --max-warnings=0

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov

  e2e-tests:
    name: e2e tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    strategy:
      matrix:
        node: ["22"]

    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Create env file
        run: |
          cat <<EOF > .env
          NODE_ENV=test
          JWT_SECRET=ci-test-jwt-secret
          JWT_EXPIRATION=1d
          RPC_TIMEOUT_MS=2000
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e
