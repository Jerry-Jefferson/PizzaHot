name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: ["22"]
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: e2e tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: ["22"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: pizzahot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_user
          MONGO_INITDB_ROOT_PASSWORD: ci_password
          MONGO_INITDB_DATABASE: pizzahot_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Installing node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Create env file
        run: |
          cat <<EOF > .env
          NODE_ENV=test
          PORT=3000
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=pizzahot_test
          MONGO_HOST=localhost
          MONGO_PORT=27017
          MONGO_INITDB_ROOT_USERNAME=ci_user
          MONGO_INITDB_ROOT_PASSWORD=ci_password
          MONGO_INITDB_DATABASE=pizzahot_test
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e
